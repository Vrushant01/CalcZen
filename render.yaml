# Render Blueprint — CalcZen API (+ admin at /admin)
services:
  - type: web
    name: calczen-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build:admin
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: hello@calczen.in
      - key: SITE_URL
        value: https://www.calczen.in
      - key: CORS_ORIGIN
        sync: false
